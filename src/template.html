<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="default">
    <header>
      <div class="logo"></div>
      <form action="" id="city-form">
        <input type="text" id="input-city" placeholder="Enter City" />
        <button type="submit" id="city-submit">
          <img
            src="images/icons/search.svg"
            alt="Go"
            width="20"
            height="20"
            title="Search"
          />
        </button>
      </form>
      <div class="settings">
        <button>
          <img
            src="images/icons/settings.svg"
            alt="Unit"
            width="30"
            title="Settings"
          />
        </button>
      </div>
    </header>
    <div class="container">
      <main></main>
    </div>

    <dialog class="settings-diag">
      <h1>Settings</h1>
      <form action="#">
        <div>
          <label for="unitGroup">Unit group:</label>
          <select name="unitGroup" id="unitGroup">
            <option value="metric">&deg;C</option>
            <option value="us">&deg;F</option>
          </select>
        </div>
        <input type="submit" value="Save" />
      </form>
    </dialog>
  </body>
</html>
